name: Build Windows Installer
on:
  workflow_run:
    workflows: ["Generar castellano"]
    types: ["completed"]
  push:
    branches: ["main"]
    paths:
      - "app/**"
  workflow_dispatch:
concurrency:
  group: build-windows
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Read version from package.json
        id: pkg
        shell: pwsh
        working-directory: app
        run: |
          if (!(Test-Path package.json)) { throw "package.json not found in app" }
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
      - name: Ensure clean release/tag for current version
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const tag = `v${{ steps.pkg.outputs.version }}`;
            const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag }).catch(() => null);
            if (rel) {
              try { await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id }); } catch (e) { core.warning(`Delete release failed: ${e}`); }
              try { await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` }); } catch (e) { core.warning(`Delete tag failed: ${e}`); }
            }
      - name: Debug environment
        shell: pwsh
        run: |
          node -v
          npm -v
          Get-ChildItem -Recurse app | Select-Object -First 50
      - name: Install deps (lockfile)
        working-directory: app
        run: npm ci --no-progress
      - name: Build web assets
        working-directory: app
        run: npm run build
      - name: Verify index.html, create fallback if missing
        shell: pwsh
        working-directory: app
        run: |
          if (!(Test-Path dist/index.html)) {
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            @"
<!doctype html>
<html><head><meta charset="utf-8"><title>Warperia-TDLO</title></head>
<body><div id="root"></div><script src="bundle.js"></script></body></html>
"@ | Set-Content -Path dist/index.html -Encoding UTF8
          }
      - name: Show electron-builder version
        working-directory: app
        run: npx electron-builder --version
      - name: Make Windows .exe (electron-builder)
        continue-on-error: true
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: pwsh
        run: |
          npm run dist:win *>&1 | Tee-Object -FilePath build-log.txt
      - name: Determine build result
        id: result
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/dist -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { echo "build_failed=True" >> $env:GITHUB_OUTPUT } else { echo "build_failed=False" >> $env:GITHUB_OUTPUT }
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build-log.txt
          if-no-files-found: ignore
      - name: Upload artifacts
        if: steps.result.outputs.build_failed == 'False'
        uses: actions/upload-artifact@v4
        with:
          name: Warperia-TDLO-windows
          path: |
            app/dist/**/*.exe
            app/dist/**
      - name: Publish Release
        if: steps.result.outputs.build_failed == 'False'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Warperia-TDLO v${{ steps.pkg.outputs.version }}
          draft: false
          files: |
            app/dist/**/*.exe
            app/dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report failure as issue (no email spam)
        if: steps.result.outputs.build_failed == 'True'
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const title = `[CI] Build Windows Installer failed for v${{ steps.pkg.outputs.version }}`;
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('app/build-log.txt', 'utf8'); } catch (e) {}
            if (log.length > 20000) log = log.slice(-20000);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Build failed for v${{ steps.pkg.outputs.version }}\nCommit: ${context.sha}\nRun: ${runUrl}\n\nLast log lines:\n\n\`\`\`\n${log}\n\`\`\``;
            const openIssues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = openIssues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['ci','windows','build-failure'] });
            }
