name: Build Windows Installer
on:
  workflow_run:
    workflows: ["Generar castellano"]
    types: ["completed"]
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version from package.json
        id: pkg
        shell: pwsh
        working-directory: app
        run: |
          if (!(Test-Path package.json)) { throw "package.json not found in app" }
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
      - name: Get latest release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const rel = await github.rest.repos.getLatestRelease({ owner, repo }).catch(() => null);
            return rel ? rel.data.tag_name : "";
      - name: Decide release
        id: decide
        shell: pwsh
        run: |
          $version = "${{ steps.pkg.outputs.version }}"
          $latestTag = "${{ steps.latest.outputs.result }}"
          if ($latestTag.StartsWith('v')) { $latestVer = $latestTag.Substring(1) } else { $latestVer = $latestTag }
          $should = $version -and ($version -ne $latestVer)
          echo "should_release=$should" >> $env:GITHUB_OUTPUT
      - name: Install deps
        if: steps.decide.outputs.should_release == 'True'
        working-directory: app
        run: npm ci
      - name: Build web assets
        if: steps.decide.outputs.should_release == 'True'
        working-directory: app
        run: npm run build
      - name: Make Windows NSIS .exe (electron-builder)
        if: steps.decide.outputs.should_release == 'True'
        working-directory: app
        run: npm run dist:win
      - name: Upload artifacts
        if: steps.decide.outputs.should_release == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: Warperia-TDLO-windows
          path: |
            app/dist/**/*.exe
            app/dist/**
      - name: Publish Release
        if: steps.decide.outputs.should_release == 'True' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Warperia-TDLO v${{ steps.pkg.outputs.version }}
          files: |
            app/dist/**/*.exe
            app/dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
