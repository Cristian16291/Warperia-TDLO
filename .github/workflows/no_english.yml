name: Enforce Spanish only (warn)
on:
  push:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan English tokens (no-fail)
        continue-on-error: true
        run: |
          set -e
          echo "Escaneo de posibles tokens en inglés (no bloquea build)"
          grep -RIEn "\b(English|Sign in|Login|Servers|Refresh|Settings|Search|Download|Update|Addons|Install|Error|Warning|Success|Bug Reports|Import|Export|Launch|Restart|Sessions|Game|Mods|Filters)\b" app || true
