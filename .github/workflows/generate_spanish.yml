name: Generar castellano
on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: ["completed"]
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: gen-spanish
  cancel-in-progress: false
jobs:
  build-spanish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug repo
        run: |
          pwd
          ls -la
      - name: Checkout upstream v1.4.0
        uses: actions/checkout@v4
        with:
          repository: warperia/warperia-frontend
          ref: v1.4.0
          path: upstream
      - name: Inspect upstream package.json
        run: |
          cat upstream/package.json | head -n 40 || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Transform upstream to Spanish-only
        run: |
          node tools/tdlo_transform.js
      - name: List app content
        run: |
          ls -la app
          test -f app/package.json && node -e "console.log(require('./app/package.json').version)"
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generado contenido en castellano desde upstream v1.4.0"
          file_pattern: "app/**"
